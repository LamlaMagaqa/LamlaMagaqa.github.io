<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Glow Salon</title>

<style>
body {margin:0;font-family:Arial;background:#f5f5f5;}

header {
background:#111;
color:white;
text-align:center;
padding:25px;
}

.hero {
background:url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9') center/cover;
height:350px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:32px;
font-weight:bold;
text-shadow:0 0 10px black;
}

.section {padding:40px;text-align:center;}

.cards {
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
}

.card {
background:white;
padding:20px;
width:220px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button {
background:#ff4da6;
color:white;
border:none;
padding:12px;
width:100%;
cursor:pointer;
}

footer {
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

a.whatsapp {
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50px;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>Luxury Glow Salon</h1>
<p>Hair • Nails • Beauty • Spa</p>
</header>

<div class="hero">
Look & Feel Beautiful ✨
</div>

<div class="section">
<h2>Our Services</h2>

<div class="cards">
<div class="card">
<h3>Hair Styling</h3>
<p>Cuts, colour & treatments</p>
</div>

<div class="card">
<h3>Nails</h3>
<p>Manicure & pedicure</p>
</div>

<div class="card">
<h3>Makeup</h3>
<p>Bridal & events makeup</p>
</div>
</div>
</div>

<div class="section">
<h2>Book Appointment</h2>
<form onsubmit="alert('Booking sent! We will contact you.'); return false;">
<input placeholder="Name" required><br><br>
<input placeholder="Phone" required><br><br>
<input type="date" required><br><br>
<button type="submit">Submit Booking</button>
</form>
</div>

<footer>
<p>© 2026 Luxury Glow Salon</p>
</footer>

<a class="whatsapp" href="https://wa.me/27000000000">
WhatsApp Us
</a>

</body>
</html>
